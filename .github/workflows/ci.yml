name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The repository holds ~4 GB of PDFs and images; CI only needs the app source.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /src/
            /index.html
            /package.json
            /package-lock.json
            /tsconfig.json
            /vite.config.ts
            /.env.production
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # type-checks, then builds
      - name: Report bundle sizes
        run: |
          echo '### Bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/assets | awk '{print $5, $9}' | sort -n >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
